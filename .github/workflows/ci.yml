name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Blex.slnx

      - name: Build (warnings as errors)
        run: dotnet build src/Blex.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test src/Blex.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults

      # Packing on every run means a broken nuspec, a missing analyzer or a stale
      # readme/icon path is caught here rather than at release time.
      - name: Pack
        run: dotnet pack src/Blex.slnx --no-build --configuration Release

      - name: Upload packages
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/packages/*
